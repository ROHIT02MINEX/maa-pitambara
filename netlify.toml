# Netlify build configuration.
# The official Next.js runtime is auto-installed by Netlify; it handles the App
# Router, Server Actions, middleware and image optimisation.

[build]
  command = "npx prisma generate && next build"

[build.environment]
  NODE_VERSION = "22"
  # Skip Prisma's postinstall telemetry prompt on CI.
  CHECKPOINT_DISABLE = "1"


